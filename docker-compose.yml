# Lance uniquement l’API. Supabase : projet cloud ou `supabase start` sur la machine.
# Si Supabase tourne sur l’hôte (port 54321), dans `.env` utilisez par exemple :
#   SUPABASE_URL=http://host.docker.internal:54321
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Linux : aide à résoudre l’hôte depuis le conteneur
    extra_hosts:
      - "host.docker.internal:host-gateway"
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 2s
      timeout: 1s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped